<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#047857" />
    <meta name="description" content="RythuSetu — AI-powered farmer decision support platform for climate risk, crop loss, schemes, Mandi prices, and benefits across Andhra Pradesh & Telangana." />
    <title>RythuSetu | AI Farmer Support Platform</title>

    <!-- PWA Web App Manifest & Mobile Tags -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="RythuSetu" />
    <meta name="application-name" content="RythuSetu" />
    <meta name="msapplication-TileColor" content="#047857" />
    <meta name="msapplication-TileImage" content="/icons/icon-192.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-emerald-100 selection:text-emerald-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- PWA Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            console.log('RythuSetu PWA Service Worker registered:', reg.scope);
          }).catch((err) => {
            console.warn('PWA registration failed:', err);
          });
        });
      }
    </script>
  </body>
</html>
