name: RythuSetu Production CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend TypeScript Verification & Bundle Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci || npm install
      - name: Run strict TypeScript check
        run: npm run typecheck
      - name: Build production bundle
        run: npm run build

  backend:
    name: Backend Security, RBAC, Migrations & API Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Upgrade pip and install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify application import
        run: python -c "from app.main import app; print('App title:', app.title)"
      - name: Verify Alembic database migrations
        run: alembic upgrade head
      - name: Run automated test suite
        env:
          APP_ENV: test
          JWT_SECRET_KEY: ci_test_secret_key_minimum_32_characters_safe
          ADMIN_INITIAL_PASSWORD: CiAdmin2026!Secure
        run: pytest test_features.py test_mandi_pipeline.py -v --tb=short
