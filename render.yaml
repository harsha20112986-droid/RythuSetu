databases:
  # Render Managed PostgreSQL — Production Starter Plan (Persistent, Automated Backups, PITR)
  - name: rythusetu-db
    databaseName: rythusetu
    user: rythusetu
    plan: starter

services:
  # ── Backend FastAPI Web Service ─────────────────────────────────────────────
  - type: web
    name: rythusetu-backend
    runtime: python
    plan: starter
    preDeployCommand: "alembic upgrade head"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    rootDir: backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production

      # PostgreSQL connection — auto-wired from the managed database
      - key: DATABASE_URL
        fromDatabase:
          name: rythusetu-db
          property: connectionString

      # JWT secrets — auto-generated 64-char cryptographic random values
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_REFRESH_SECRET_KEY
        generateValue: true

      # Admin bootstrap password — auto-generated on Render, overridable in dashboard
      - key: ADMIN_INITIAL_PASSWORD
        generateValue: true

      # CORS: allow Vercel frontend + local dev
      - key: ALLOWED_ORIGINS
        value: "https://rythu-setu.vercel.app,http://localhost:5173"

      # ── Mandi Ingestion Pipeline ──────────────────────────────────────────
      # Register at https://data.gov.in → My Account → API Keys
      # Set this in Render Dashboard → rythusetu-backend → Environment
      - key: DATA_GOV_API_KEY
        sync: false   # Must be set manually in the Render Dashboard (secret)

  # ── Nightly Mandi Ingestion Cron Job ────────────────────────────────────────
  # Runs after all major APMC markets close (01:00 IST = 19:30 UTC)
  - type: cron
    name: rythusetu-mandi-sync
    runtime: python
    plan: starter
    schedule: "30 19 * * *"        # 01:00 IST daily (market data settled by midnight)
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python cron_sync.py"
    rootDir: backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production

      # Shares the same database as the web service
      - key: DATABASE_URL
        fromDatabase:
          name: rythusetu-db
          property: connectionString

      # Shares the same JWT secrets (needed for db_init bootstrap on first run)
      - key: JWT_SECRET_KEY
        fromService:
          type: web
          name: rythusetu-backend
          envVarKey: JWT_SECRET_KEY

      - key: ADMIN_INITIAL_PASSWORD
        fromService:
          type: web
          name: rythusetu-backend
          envVarKey: ADMIN_INITIAL_PASSWORD

      # The ingestion API key — same one the web service uses
      - key: DATA_GOV_API_KEY
        sync: false   # Must be set manually in the Render Dashboard

      # Telangana & Andhra Pradesh mandi sync (both states)
      - key: MANDI_SYNC_STATES
        value: "Telangana,Andhra Pradesh"

      # Records limit per upstream API call per state
      - key: MANDI_SYNC_LIMIT
        value: "1000"

  # ── Frontend Static Site ─────────────────────────────────────────────────────
  - type: web
    name: rythusetu-frontend
    runtime: static
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    rootDir: frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://rythusetu-backend.onrender.com"
